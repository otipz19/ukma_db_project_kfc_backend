components:
  responses:
    NotModified:
      description: Not Modified

    BadRequest:
      description: Invalid Parameters
      content:
        application/json:
          schema:
            type: array
            items:
              type: string

    NotFound:
      description: The specified resource was not found

    Unauthorized:
      description: Unauthorized

    Forbidden:
      description: Forbidden

    InternalServerError:
      description: Internal Server Error

  schemas:
    BaseFilter:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        sortBy:
          type: string
          default: 'id'
        descendingOrder:
          type: boolean
          default: false