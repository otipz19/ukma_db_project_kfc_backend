openapi: 3.0.0
info:
  description: User Phones Service
  version: '1.0'
  title: User Phones Service

tags:
  - name: user-phones-controller
    description: User Phones Controller
servers:
  - url: http://localhost:8080

paths:
  /api/user/{userId}/phones:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer

    get:
      operationId: getUserPhones
      tags:
        - user-phones-controller
      summary: Get user phones
      responses:
        200:
          description: User phones
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  maxLength: 15
        401:
          $ref: 'common-types.yaml#/components/responses/Unauthorized'
        403:
          $ref: 'common-types.yaml#/components/responses/Forbidden'
        404:
          $ref: 'common-types.yaml#/components/responses/NotFound'
        500:
          $ref: 'common-types.yaml#/components/responses/InternalServerError'

    put:
      operationId: setUserPhones
      tags:
        - user-phones-controller
      summary: Set user phones
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                maxLength: 15
      responses:
        204:
          description: User phones were set
        401:
          $ref: 'common-types.yaml#/components/responses/Unauthorized'
        403:
          $ref: 'common-types.yaml#/components/responses/Forbidden'
        404:
          $ref: 'common-types.yaml#/components/responses/NotFound'
        500:
          $ref: 'common-types.yaml#/components/responses/InternalServerError'